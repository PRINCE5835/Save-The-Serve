[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "save-the-serve"
version = "0.1.0"
description = "Save The Serve (S.T.S) - High-Performance Geospatial Food & Essentials Rescue Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Save The Serve Engineering Team", email = "engineering@savetheserve.org" }
]
keywords = ["fastapi", "geospatial", "postgis", "food-rescue", "supabase", "sqlalchemy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    # Core Framework & ASGI Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    
    # Data Validation & Configuration (Pydantic v2)
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "email-validator>=2.2.0",

    # Database, ORM & Geospatial
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.16.0",
    "shapely>=2.0.6",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.3",

    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",

    # HTTP Client & External Integrations
    "httpx>=0.27.2",
    
    # Payment Gateways
    "stripe>=10.12.0",
    "razorpay>=1.4.1",

    # Caching & Realtime
    "redis>=5.1.0",

    # Cloud Storage & Supabase Client
    "supabase>=2.8.2",
    "boto3>=1.35.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]
